services:
  api:
    image: myapp:latest
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    build: ./api
    env_file:
      - .env
    volumes:
      - ./api:/api
      - /api/node_modules
    networks:
      - codegames-network
    depends_on:
      db:
        condition: service_healthy
  web:
    image: myapp-web:latest
    build: ./web
    ports:
      - "5173:5173"
    volumes:
      - ./web:/web
      - /web/node_modules
    networks:
      - codegames-network
  db:
    image: postgres:17
    restart: always
    # 5433 because the host already runs its own Postgres on 5432.
    ports:
      - "127.0.0.1:5433:5432"
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - codegames-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 30s
      retries: 5
      start_period: 30s
networks:
  codegames-network:
    driver: bridge
volumes:
  pgdata:
