name: API Workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  api-action:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: checkout the codebase
        uses: actions/checkout@v6
      - name: install node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: install all dependencies
        run: npm ci
      # - name: run all linting
      #   run: npx tsc --noEmit -p .
